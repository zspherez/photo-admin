name: Diagnose festival B2B migration

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'zspherez/photo-admin'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ || "$REQUESTED_REVISION" != "$actual_revision" ]]; then
            echo "::error::revision must equal the exact current main SHA"
            exit 1
          fi
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read failed migration record and schema state
        run: |
          node <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const db = new PrismaClient({ datasourceUrl: process.env.DIRECT_URL });
          (async () => {
            try {
              const rows = await db.$queryRaw`
                SELECT "checksum", "logs", "finished_at" IS NOT NULL AS "finished",
                       "rolled_back_at" IS NOT NULL AS "rolledBack"
                FROM "_prisma_migrations"
                WHERE "migration_name" = '20261015160000_festival_b2b'
                ORDER BY "started_at" DESC
              `;
              for (const row of rows) {
                const logs = (row.logs || "").replace(/postgres(?:ql)?:\/\/\S+/gi, "[REDACTED]");
                console.log(JSON.stringify({
                  checksum: row.checksum,
                  finished: row.finished,
                  rolledBack: row.rolledBack,
                  logs: logs.slice(0, 2500),
                }));
              }
              const tables = await db.$queryRaw`
                SELECT table_name
                FROM information_schema.tables
                WHERE table_schema = current_schema()
                  AND table_name IN ('FestivalB2b', 'FestivalB2bMember')
              `;
              console.log(JSON.stringify({ tables: tables.map((row) => row.table_name) }));
              const [count] = await db.$queryRaw`
                SELECT count(*)::int AS "compositeCount"
                FROM "ShowArtist" sa
                JOIN "Show" s ON s."id" = sa."showId"
                JOIN "Artist" a ON a."id" = sa."artistId"
                WHERE s."isFestival" AND sa."rejectedAt" IS NULL
                  AND a."name" ~* '[[:space:]]+b2b[[:space:]]+'
              `;
              console.log(JSON.stringify(count));
              const members = await db.$queryRaw`
                SELECT a."name" AS "pairing", trim(part.value) AS "member",
                       (SELECT count(*)::int FROM "Artist" candidate
                        WHERE candidate."normalizedName" =
                          trim(regexp_replace(lower(replace(trim(part.value), '&', 'and')),
                            '[^[:alnum:]]+', ' ', 'g'))
                           OR lower(candidate."name") = lower(trim(part.value))
                       ) AS "matches",
                       (SELECT count(*)::int FROM "ArtistIdentityNameClaim" claim
                        WHERE claim."normalizedName" =
                          trim(regexp_replace(lower(replace(trim(part.value), '&', 'and')),
                            '[^[:alnum:]]+', ' ', 'g'))
                       ) AS "claims",
                       sa."providerManaged", sa."manuallyAdded"
                FROM "ShowArtist" sa
                JOIN "Show" s ON s."id" = sa."showId"
                JOIN "Artist" a ON a."id" = sa."artistId"
                CROSS JOIN LATERAL unnest(
                  regexp_split_to_array(a."name", '[[:space:]]+b2b[[:space:]]+', 'i')
                ) AS part(value)
                WHERE s."isFestival" AND sa."rejectedAt" IS NULL
                  AND a."name" ~* '[[:space:]]+b2b[[:space:]]+'
                ORDER BY a."name", part.value
              `;
              for (const member of members) console.log(JSON.stringify(member));
              const candidates = await db.$queryRaw`
                SELECT a."id", a."name", a."normalizedName",
                       a."spotifyId" IS NOT NULL AS "spotifyLinked",
                       a."edmtrainId" IS NOT NULL AS "edmtrainLinked",
                       (SELECT count(*)::int FROM "Contact" c WHERE c."artistId" = a."id") AS "contacts",
                       (SELECT count(*)::int FROM "Outreach" o WHERE o."artistId" = a."id") AS "outreaches",
                       (SELECT count(*)::int FROM "ShowArtist" sa WHERE sa."artistId" = a."id") AS "shows"
                FROM "Artist" a
                WHERE a."normalizedName" IN ('cid', 'josh baker')
                   OR lower(a."name") IN ('cid', 'josh baker')
                ORDER BY lower(a."name"), a."id"
              `;
              for (const candidate of candidates) console.log(JSON.stringify({ candidate }));
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : "Diagnosis failed");
            process.exitCode = 1;
          });
          NODE
