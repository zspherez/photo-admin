name: Diagnose festival B2B migration

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'zspherez/photo-admin'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ || "$REQUESTED_REVISION" != "$actual_revision" ]]; then
            echo "::error::revision must equal the exact current main SHA"
            exit 1
          fi
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read failed migration record and schema state
        run: |
          node <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const db = new PrismaClient({ datasourceUrl: process.env.DIRECT_URL });
          (async () => {
            try {
              const rows = await db.$queryRaw`
                SELECT "checksum", "logs", "finished_at" IS NOT NULL AS "finished",
                       "rolled_back_at" IS NOT NULL AS "rolledBack"
                FROM "_prisma_migrations"
                WHERE "migration_name" = '20261015160000_festival_b2b'
                ORDER BY "started_at" DESC
              `;
              for (const row of rows) {
                const logs = (row.logs || "").replace(/postgres(?:ql)?:\/\/\S+/gi, "[REDACTED]");
                console.log(JSON.stringify({
                  checksum: row.checksum,
                  finished: row.finished,
                  rolledBack: row.rolledBack,
                  logs: logs.slice(0, 2500),
                }));
              }
              const tables = await db.$queryRaw`
                SELECT table_name
                FROM information_schema.tables
                WHERE table_schema = current_schema()
                  AND table_name IN ('FestivalB2b', 'FestivalB2bMember')
              `;
              console.log(JSON.stringify({ tables: tables.map((row) => row.table_name) }));
              const [count] = await db.$queryRaw`
                SELECT count(*)::int AS "compositeCount"
                FROM "ShowArtist" sa
                JOIN "Show" s ON s."id" = sa."showId"
                JOIN "Artist" a ON a."id" = sa."artistId"
                WHERE s."isFestival" AND sa."rejectedAt" IS NULL
                  AND a."name" ~* '[[:space:]]+b2b[[:space:]]+'
              `;
              console.log(JSON.stringify(count));
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : "Diagnosis failed");
            process.exitCode = 1;
          });
          NODE
