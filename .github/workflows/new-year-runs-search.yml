name: Search New Year's runs

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Existing manually requested search batch ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: new-year-runs-${{ inputs.batch_id }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Search bounded public event sources
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          NEW_YEAR_BATCH_ID: ${{ inputs.batch_id }}
        run: npx tsx scripts/run-new-year-search.ts
